name: Manter Resenha do Fut ativo

on:
  # Horário de Brasília (UTC-3): todos os dias, das 06:00 às 23:50.
  # GitHub Actions usa UTC; por isso o período atravessa a meia-noite UTC.
  schedule:
    - cron: "*/10 9-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-render-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acessar o Resenha do Fut
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --retry 2 --retry-delay 5 \
            https://resenhadofut.onrender.com/ \
            --output /dev/null
